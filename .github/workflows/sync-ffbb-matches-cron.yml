name: 🏀 Sync FFBB Matches (Cron Auto-Import)

on:
  schedule:
    # Tous les jours à 06:17 UTC (08:17 heure de Paris en été / 07:17 en hiver)
    # Minute décalée (17) pour éviter l'engorgement des runners GitHub Actions à heure pile (:00)
    - cron: '17 6 * * *'
    # Filet de sécurité si GitHub drop le créneau du matin (10:17 heure de Paris en été)
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Mode simulation (Dry Run)'
        required: false
        default: false
        type: boolean
      team:
        description: 'Filtrer sur une équipe spécifique (laisser vide pour toutes)'
        required: false
        default: ''
        type: string
  # Un push sur ce fichier relance la sync (sert aussi à réenregistrer le schedule GitHub)
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-ffbb-matches-cron.yml'

concurrency:
  group: sync-ffbb-matches
  cancel-in-progress: false

jobs:
  sync-matches:
    name: ⚡ Synchronisation FFBB -> Firestore
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin ffbb-data-client httpx

      - name: 🔑 Configure Firebase Service Account
        env:
          SERVICE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_KEY || secrets.SERVICE_ACCOUNT_KEY || secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -n "$SERVICE_KEY" ]; then
            echo "$SERVICE_KEY" > serviceAccountKey.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=serviceAccountKey.json" >> $GITHUB_ENV
          else
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT non trouvé dans les secrets du repository."
            exit 1
          fi

      - name: 🚀 Run FFBB Import Script
        env:
          FFBB_API_URL: https://ffbb-api.desimone.fr
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.team }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --team '${{ github.event.inputs.team }}'"
          fi
          python scripts/import_ffbb_matches.py $EXTRA_ARGS

      - name: 🧹 Cleanup Credentials
        if: always()
        run: |
          rm -f serviceAccountKey.json
