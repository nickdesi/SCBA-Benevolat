server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Types MIME & support WebManifest
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Alias de compatibilité /manifest.json -> /manifest.webmanifest
    location = /manifest.json {
        default_type application/manifest+json;
        try_files /manifest.webmanifest =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # 2. PWA Service Worker, WebManifest & Workbox : Strict no-cache pour mises à jour instantanées
    location ~* ^/(sw\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # 3. HTML : Strict no-cache pour recharger la dernière version de l'application
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # 4. Assets hachés Vite (/assets/) : Cache immuable 1 an
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 5. Médias statiques, icônes et polices web auto-hébergées
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2?|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 6. Reverse Proxy API FFBB vers Dokploy (ffbb-data-client)
    location /api/v1/ {
        proxy_pass http://192.168.1.146:80;
        proxy_set_header Host ffbb-api.desimone.fr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. SPA Routing : Fallback vers index.html pour React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
